name: Scrape AppEx UI-driven institutes

# Covers every institute in INSTITUTE_CONFIGS inside appex_ui_scraper.py.
# Adding a new institute to that config does NOT need a new workflow.

on:
  schedule:
    - cron: '30 1,13 * * *'   # 7:00 AM & 7:00 PM IST
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: run a single institute slug (e.g. ts-rahaman)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Network diagnostic (is this even a browser-level issue?)
        # Runs BEFORE the scraper. Plain curl, no browser involved -- this
        # tells us whether the timeouts we've been chasing are a Playwright/
        # browser problem at all, or whether the connection itself stalls
        # for ANY client from this runner. The -w timing breakdown shows
        # exactly which phase hangs (DNS / TCP connect / TLS handshake /
        # waiting on response), which narrows the cause far better than
        # another guess-and-check browser-level fix would.
        run: |
          echo "--- DNS resolution ---"
          getent hosts booking.tsrahaman.org || echo "DNS FAILED"
          echo ""
          echo "--- curl with timing breakdown (20s max) ---"
          curl -v --max-time 20 -o /dev/null \
            -w "\nHTTP status: %{http_code}\nDNS time: %{time_namelookup}s\nConnect time: %{time_connect}s\nTLS handshake done at: %{time_appconnect}s\nTotal time: %{time_total}s\n" \
            "https://booking.tsrahaman.org/Login/Register?mkey=ose" \
            || echo "*** curl FAILED or timed out -- this points to a network-level block, not a Playwright issue ***"
        continue-on-error: true

      - name: Run AppEx UI scraper
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python appex_ui_scraper.py --only "${{ github.event.inputs.only }}"
          else
            python appex_ui_scraper.py
          fi

      - name: Push data to WordPress (fails the run if nothing is saved)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python ingest.py ingest-appex-ui appex_ui_courses.json

      - name: Upload artifacts (for debugging if fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appex-ui-scrape-output
          path: |
            appex_ui_courses.json
            appex_ui_checkpoint_*.json
            failure_*.png
            failure_*.html
