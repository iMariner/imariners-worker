name: Scrape SIMF (simfedu.com)

on:
  schedule:
    # Runs at 2:30 AM UTC (8:00 AM IST) and 2:30 PM UTC (8:00 PM IST)
    - cron: '30 2,14 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run SIMF scraper (scrapes + pushes to WordPress)
        env:
          IMCFI_INGEST_URL: https://imariners.com/wp-json/imcfi/v1/ingest-marineims
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python simf_scraper.py

      - name: Upload artifacts (for debugging if fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simf-scrape-output
          path: |
            simf_courses.json
            simf_courses.csv
