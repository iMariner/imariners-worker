name: Scrape All Institutes Every 12 Hours

on:
  schedule:
    - cron: '0 0 * * *'    # 12 AM (midnight)
    - cron: '0 12 * * *'   # 12 PM (noon)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: node worker.js
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}

