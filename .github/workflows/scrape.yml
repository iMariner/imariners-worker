name: Scrape All Institutes Every 12 Hours

on:
  schedule:
    - cron: '0 0 * * *'    # 12 AM (midnight)
    - cron: '0 12 * * *'   # 12 PM (noon)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node worker.js
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}

