name: Scrape BP Marine Academy

on:
  schedule:
    # Runs at 1:00 AM UTC (6:30 AM IST) and 1:00 PM UTC (6:30 PM IST)
    - cron: '0 1,13 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright (Python package)
        run: pip install playwright requests

      - name: Get installed Playwright version
        id: pw-version
        run: echo "version=$(pip show playwright | grep -i '^Version' | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
        # Keying on the *actually installed* version (read back above, not
        # hardcoded) means this cache can never go stale/mismatched even if
        # a future run picks up a newer Playwright release -- it'll just get
        # a fresh cache key and download once for that new version.

      - name: Install Chromium browser
        run: playwright install chromium --with-deps
        # Unchanged command/flag order from before. Playwright itself already
        # skips re-downloading a browser binary that's already present in
        # ~/.cache/ms-playwright, so on a cache hit this step mainly just
        # verifies/installs OS-level libs (fast) instead of re-fetching the
        # browser (the large download).
      
      - name: Run BP Marine scraper
        run: python bpmarine_scraper.py
      
      - name: Push data to WordPress (fails the run if nothing is saved)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: python ingest.py ingest-bpmarine bpmarine_courses.json
      
      - name: Upload artifacts (for debugging if fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bpmarine-scrape-output
          path: |
            bpmarine_courses.json
            bpmarine_courses.csv
