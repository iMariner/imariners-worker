name: Scrape BP Marine Academy

on:
  schedule:
    # Runs at 1:00 AM UTC (6:30 AM IST) and 1:00 PM UTC (6:30 PM IST)
    - cron: '0 1,13 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps
      
      - name: Run BP Marine scraper
        run: python bpmarine_scraper.py
      
      - name: Push data to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: |
          curl -X POST "${WP_URL}/wp-json/imcfi/v1/ingest-bpmarine" \
            -H "X-IMCFI-Token: ${WORKER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @bpmarine_courses.json
      
      - name: Upload artifacts (for debugging if fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bpmarine-scrape-output
          path: |
            bpmarine_courses.json
            bpmarine_courses.csv